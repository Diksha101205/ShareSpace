server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sharespace_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  demo-mode: ${DEMO_MODE:false}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:sharespace-30a92}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  active-booking-limit: ${ACTIVE_BOOKING_LIMIT:3}
  waitlist-enabled: ${WAITLIST_ENABLED:true}
